# Traefik file-provider route for webui (see compose.traefik.yml).
# Replace DOMAIN before copying it into Traefik's dynamic config directory.
http:
  routers:
    blindensport-webui-http:
      rule: Host(`DOMAIN`)
      entryPoints: [http]
      middlewares: [blindensport-webui-https]
      service: blindensport-webui
    blindensport-webui:
      rule: Host(`DOMAIN`)
      entryPoints: [https]
      service: blindensport-webui
      tls:
        certResolver: letsencrypt
  middlewares:
    blindensport-webui-https:
      redirectScheme:
        scheme: https
        permanent: true
  services:
    blindensport-webui:
      loadBalancer:
        servers:
          - url: http://blindensport-webui:8080
