# Supabase project the web UI works on. Admins act with their OWN
# account (user JWT + anon key), so Supabase RLS and the RPCs decide what
# they may do, exactly like in the iOS app. The service key is used only for
# the calendar feed (/calendar/{token}), which has no signed-in user.
supabase.url=${SUPABASE_URL}
supabase.anon-key=${SUPABASE_ANON_KEY}
supabase.service-key=${SUPABASE_SERVICE_KEY:}

# The REST API's session cookie is Secure by default (Caddy or Traefik terminates TLS in
# front of this server). Only for local testing over plain http://localhost:
# SESSION_COOKIE_SECURE=false.
webui.session-cookie-secure=${SESSION_COOKIE_SECURE:true}

# MCP server (/mcp). This address goes into PRAE download links.
webui.mcp.public-url=${MCP_PUBLIC_URL:https://bs.a11y.it}
quarkus.mcp.server.server-info.name=Blindensport Graz

quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0
quarkus.default-locale=de-AT
quarkus.log.category."it.a11y.blindensport".level=INFO

# Vaadin's own session cookie: Secure/HttpOnly in SessionCookieSetup.java
# (Undertow can't set SameSite on JSESSIONID; Vaadin's CSRF token covers it).

# Security headers on every response: SecurityHeaders.java (a Vert.x filter;
# quarkus.http.header.* doesn't reach Vaadin's Undertow responses).

# Tests and dev mode: point at a local Supabase (`supabase start`) or WireMock.
%dev.supabase.url=${SUPABASE_URL:http://127.0.0.1:54321}
%dev.webui.session-cookie-secure=false
%test.supabase.url=http://localhost:0
%test.supabase.anon-key=test-anon-key
%test.supabase.service-key=test-service-key
%test.webui.session-cookie-secure=false

# REST API description: /q/openapi (YAML; ?format=json). Only the /api paths,
# no Swagger UI page in production.
mp.openapi.extensions.smallrye.info.title=Blindensport Graz REST API
mp.openapi.extensions.smallrye.info.description=Personal token (Authorization: Bearer bsg_mcp_...) or the session cookie of POST /api/session.
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=false
mp.openapi.scan.exclude.packages=it.a11y.blindensport.webui.calendar,it.a11y.blindensport.webui.mcp
