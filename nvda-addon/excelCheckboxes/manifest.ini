name = excelCheckboxes
summary = "Excel checkbox state in cell labels"
description = """Adds the state of an Excel form checkbox to the cell it sits on, as [X] or [ ] in braille and as ausgewählt or nicht ausgewählt in speech. The state is read from the checkbox itself each time, so it stays right when a box changes. NVDA+Alt+X ticks or unticks the checkbox on the current cell."""
author = "Franz Kager"
version = 0.3.0
minimumNVDAVersion = 2024.2.0
lastTestedNVDAVersion = 2026.3.0
