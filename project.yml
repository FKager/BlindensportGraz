name: BlindensportGraz
options:
  bundleIdPrefix: it.a11y
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "5Q57Y9YT8J"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: "YES"
    ENABLE_DEBUG_DYLIB: "NO"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.0
  # Shared Member/ClubMember record shape (audit.md Architecture Finding 5) —
  # also depended on by RootCLI/Package.swift, see Shared/ClubSchema/Package.swift.
  ClubSchema:
    path: Shared/ClubSchema
targets:
  BlindensportGraz:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: BlindensportGraz
        excludes:
          - "Info.plist"
          - "BlindensportGraz.entitlements"
          - "BlindensportGrazRelease.entitlements"
    dependencies:
      - package: ZIPFoundation
      - package: ClubSchema
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.a11y.BlindensportGraz
        GENERATE_INFOPLIST_FILE: YES
        # CFBundleShortVersionString / CFBundleVersion. Local + Debug builds use
        # these as-is; the TestFlight workflow overrides them per run (marketing
        # version from the git tag, build number from the CI run number).
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # App uses only standard HTTPS/TLS (CloudKit, URLSession) — exempt from
        # US export compliance. Declaring this here stops every TestFlight build
        # from parking in "Missing Compliance" until answered by hand.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Blindensport Graz"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5Q57Y9YT8J"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGNING_ALLOWED: "YES"
      configs:
        # Debug (local Xcode, on-device deploys) keeps the sandbox APNs
        # environment; Release/TestFlight/App Store builds must use the
        # production aps-environment or the App Store provisioning profile
        # won't match the app's entitlements at archive/export time.
        Debug:
          CODE_SIGN_ENTITLEMENTS: BlindensportGraz/BlindensportGraz.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: BlindensportGraz/BlindensportGrazRelease.entitlements
  BlindensportGrazTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: BlindensportGrazTests
    dependencies:
      - target: BlindensportGraz
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5Q57Y9YT8J"
