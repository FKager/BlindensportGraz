# Type check of the Supabase Edge Functions (supabase/functions/*/index.ts).
# They run on Supabase's Edge Runtime, which is Deno: `deno check` understands
# Deno.serve / Deno.env and the npm: / jsr: imports exactly as production
# does. No secrets needed; nothing is deployed.
name: Edge Functions Check

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/edge-functions-check.yml"]
  pull_request:
    paths: ["supabase/functions/**", ".github/workflows/edge-functions-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.8"
      - name: deno check
        run: deno check supabase/functions/*/index.ts
