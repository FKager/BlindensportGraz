name: iOS Build and Deploy

# Everything here runs through xcodebuild/security/xcrun on the command line —
# no Xcode GUI, no Transporter app, no Organizer. Two jobs:
#   build       - runs on every push/PR, unsigned build for the simulator, fast feedback.
#   deploy      - runs only on tags like "v1.0.0", signs a Release archive and
#                 uploads it to TestFlight/App Store Connect.
#
# Required repository secrets for the deploy job:
#   BUILD_CERTIFICATE_BASE64        base64 of your Distribution .p12  (base64 -i cert.p12 | pbcopy)
#   P12_PASSWORD                    password used when exporting the .p12
#   BUILD_PROVISION_PROFILE_BASE64  base64 of the App Store .mobileprovision for it.a11y.BlindensportGraz
#   WIDGET_PROVISION_PROFILE_BASE64 base64 of the App Store .mobileprovision for it.a11y.BlindensportGraz.Widgets
#   SHARE_EXTENSION_PROVISION_PROFILE_BASE64
#                                    base64 of the App Store .mobileprovision for it.a11y.BlindensportGraz.ShareExtension
#   KEYCHAIN_PASSWORD               any random string, used only for the temporary CI keychain
#   APPSTORE_TEAM_ID                your 10-character Apple Developer Team ID
#   APP_STORE_CONNECT_KEY_ID        App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID     App Store Connect API issuer ID
#   APP_STORE_CONNECT_API_KEY_BASE64  base64 of the AuthKey_<KEY_ID>.p8 file

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# GitHub intermittently emits two push-triggered runs for a single
# multi-commit push (confirmed 2026-09-08: commit 5d75093 spawned two full
# runs of this workflow AND two of "iOS Device Deploy", all `event: push`,
# same head SHA, same timestamp — see .wolf/buglog.json bug-386). Key the
# group by ref (not a static name) so different branches / PRs / release
# tags still run independently, but a duplicate — or a rapid re-push to the
# same ref — collapses to one run, newest wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: BlindensportGraz
  PROJECT: BlindensportGraz.xcodeproj
  BUNDLE_ID: it.a11y.BlindensportGraz
  WIDGET_BUNDLE_ID: it.a11y.BlindensportGraz.Widgets
  SHARE_EXTENSION_BUNDLE_ID: it.a11y.BlindensportGraz.ShareExtension
  # Same Xcode as local development and the self-hosted device deploy.
  # Pinned exactly: the xcode-27 image also lists betas, and beta builds
  # can't be uploaded to TestFlight.
  XCODE_VERSION: "27.2"

jobs:
  build:
    name: Build and test (unsigned, simulator)
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        # The project is in Swift 6 language mode with Swift 6.2+ build
        # settings (SWIFT_DEFAULT_ACTOR_ISOLATION, SWIFT_APPROACHABLE_CONCURRENCY,
        # `@concurrent`), and its SwiftData @Model class hierarchy
        # (SportEvent/Training/Tournament) needs the iOS 26+ SDK's SwiftData
        # macro for class inheritance (see .wolf/cerebrum.md's 2026-07-18
        # entry). Since 2026-11-19 CI runs on GitHub's `xcode-27` image
        # (public preview) with Xcode $XCODE_VERSION (Swift 6.4), matching
        # local builds; before that it was macos-26 with Xcode 26.6.
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "::error::Xcode $XCODE_VERSION not found on this runner (only found: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')). Update XCODE_VERSION in this workflow to an installed release (not beta) Xcode."
            exit 1
          fi
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Builds the app and runs the unit tests (BlindensportGrazTests) in a
      # Simulator, unsigned like before. The first available iPhone on the
      # runner is used, so a new runner image needs no edit here.
      - name: Build and test in the Simulator
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No iPhone simulator available on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Testing on simulator $DEVICE_ID"
          # The runner's Simulator is English and UTC; the app (German UI,
          # German plurals in Localizable.xcstrings, Austrian dates) and its
          # tests assume German / Austria / Vienna time, as on the club's
          # iPhones. TEST_RUNNER_* variables reach the test process without
          # the prefix.
          TEST_RUNNER_TZ=Europe/Vienna xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$DEVICE_ID" \
            -testLanguage de \
            -testRegion AT \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --renderer github-actions

  deploy:
    name: Archive, sign and upload to TestFlight
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        # See the identical step in the build job above for why this can't
        # just be /Applications/Xcode.app.
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "::error::Xcode $XCODE_VERSION not found on this runner (only found: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')). Update XCODE_VERSION in this workflow to an installed release (not beta) Xcode."
            exit 1
          fi
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Signing model: automatic (xcode-managed) + App Store Connect API key.
      # An earlier version of this job used manual signing with an uploaded
      # .mobileprovision and CODE_SIGN_STYLE=Manual on the xcodebuild command
      # line. That reliably fails here because a global CODE_SIGN_STYLE=Manual
      # also lands on the ZIPFoundation SPM resource-bundle target, which
      # errors with "does not support provisioning profiles" (bundle-only
      # targets aren't profile-eligible), and there is no xcodebuild CLI
      # syntax to scope a build setting to just one target — see the long
      # write-up in .github/workflows/ios-device-deploy.yml. Automatic signing
      # + `-allowProvisioningUpdates` with the API key sidesteps all of that:
      # Xcode resolves/downloads the right App Store profile per target and
      # leaves the SPM bundle alone. The API key (App Manager role) already
      # has Certificates/Identifiers/Profiles access.
      - name: Set up API key, signing keychain and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          IOS_CI_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CI_CERTIFICATE_P12_BASE64 }}
          IOS_CI_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CI_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISION_PROFILE_BASE64 }}
          SHARE_EXTENSION_PROVISION_PROFILE_BASE64: ${{ secrets.SHARE_EXTENSION_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          # --- App Store Connect API key (.p8) ---
          # Used by xcodebuild archive (-authenticationKeyPath) and by altool.
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR" ~/.appstoreconnect/private_keys
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          # asc 7+ refuses a key file others can read ("private key file is
          # too permissive"); v0.15.0's distribution step failed on it.
          chmod 600 "$KEY_PATH"
          cp -p "$KEY_PATH" ~/.appstoreconnect/private_keys/
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

          # --- Ephemeral keychain with the Apple Distribution identity ---
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          # --- Existing Apple Development identity (6Y392859QZ) ---
          # Automatic signing archives with an "Apple Development" identity.
          # Without one in the keychain, -allowProvisioningUpdates made Xcode
          # create a NEW development certificate on every (fresh) runner,
          # whose private key died with the runner — until Apple's
          # certificate limit stopped the release (2026-11-03). Importing the
          # identity the device-deploy workflow already uses makes Xcode
          # reuse it instead.
          DEV_CERT_PATH="$RUNNER_TEMP/development.p12"
          echo -n "$IOS_CI_CERTIFICATE_P12_BASE64" | base64 --decode -o "$DEV_CERT_PATH"
          security import "$DEV_CERT_PATH" -P "$IOS_CI_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$DEV_CERT_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Put our keychain first in the search list so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # --- App Store provisioning profile ---
          # `-exportArchive` with signingStyle=automatic + -allowProvisioningUpdates
          # hits a "Cloud signing permission error" here (the App Manager API key
          # can't drive server-side signing), so the export is done with MANUAL
          # signing against this pre-created profile instead. `archive` still uses
          # automatic — it signs locally with the cert above and only needs the
          # profile to already exist, which it does.
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$PP_PATH" ~/Library/MobileDevice/"Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed profile '$PROFILE_NAME' ($PROFILE_UUID)"

          # Same, for the BlindensportGrazWidgets extension target — the app
          # has carried a widget extension since the home-screen widget
          # feature (App Group required both bundle ids' App Store profiles
          # to be regenerated once App Groups was added, see
          # .wolf/cerebrum.md's widget-portal-setup entries).
          WIDGET_PP_PATH="$RUNNER_TEMP/widget-profile.mobileprovision"
          echo -n "$WIDGET_PROVISION_PROFILE_BASE64" | base64 --decode -o "$WIDGET_PP_PATH"
          security cms -D -i "$WIDGET_PP_PATH" > "$RUNNER_TEMP/widget-profile.plist"
          WIDGET_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/widget-profile.plist")
          WIDGET_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/widget-profile.plist")
          cp "$WIDGET_PP_PATH" ~/Library/MobileDevice/"Provisioning Profiles/$WIDGET_PROFILE_UUID.mobileprovision"
          echo "WIDGET_PROFILE_UUID=$WIDGET_PROFILE_UUID" >> "$GITHUB_ENV"
          echo "WIDGET_PROFILE_NAME=$WIDGET_PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed profile '$WIDGET_PROFILE_NAME' ($WIDGET_PROFILE_UUID)"

          # Same, for the BlindensportGrazShareExtension target — the app
          # has carried a Share Extension since the "create a tournament by
          # sharing a file into the app" feature, which also needs its own
          # App Store profile embedded at export time (manual signingStyle
          # requires an explicit profile per embedded target/bundle id).
          SHARE_EXTENSION_PP_PATH="$RUNNER_TEMP/share-extension-profile.mobileprovision"
          echo -n "$SHARE_EXTENSION_PROVISION_PROFILE_BASE64" | base64 --decode -o "$SHARE_EXTENSION_PP_PATH"
          security cms -D -i "$SHARE_EXTENSION_PP_PATH" > "$RUNNER_TEMP/share-extension-profile.plist"
          SHARE_EXTENSION_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/share-extension-profile.plist")
          SHARE_EXTENSION_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/share-extension-profile.plist")
          cp "$SHARE_EXTENSION_PP_PATH" ~/Library/MobileDevice/"Provisioning Profiles/$SHARE_EXTENSION_PROFILE_UUID.mobileprovision"
          echo "SHARE_EXTENSION_PROFILE_UUID=$SHARE_EXTENSION_PROFILE_UUID" >> "$GITHUB_ENV"
          echo "SHARE_EXTENSION_PROFILE_NAME=$SHARE_EXTENSION_PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed profile '$SHARE_EXTENSION_PROFILE_NAME' ($SHARE_EXTENSION_PROFILE_UUID)"

      - name: Derive version numbers
        run: |
          set -euo pipefail
          # Marketing version from the tag (refs/tags/v0.1.0 -> 0.1.0);
          # fall back to 0.0.0 for a manual dispatch with no tag.
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$RAW_TAG" == v* ]]; then
            MARKETING_VERSION="${RAW_TAG#v}"
          else
            MARKETING_VERSION="0.0.0"
          fi
          # Build number: CI run number is monotonic and unique per repo.
          BUILD_NUMBER="${{ github.run_number }}"
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Version $MARKETING_VERSION ($BUILD_NUMBER)"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -destination "generic/platform=iOS" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${{ secrets.APPSTORE_TEAM_ID }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            | xcbeautify --renderer github-actions

      - name: Export IPA
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPSTORE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
              <key>${WIDGET_BUNDLE_ID}</key>
              <string>${WIDGET_PROFILE_UUID}</string>
              <key>${SHARE_EXTENSION_BUNDLE_ID}</key>
              <string>${SHARE_EXTENSION_PROFILE_UUID}</string>
            </dict>
            <key>destination</key>
            <string>export</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          # Our keychain is already first in the search list (see the setup
          # step), so codesign finds the "Apple Distribution" identity here.
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            | xcbeautify --renderer github-actions

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -n1)
          if [ -z "$IPA_PATH" ]; then echo "::error::No .ipa produced by export"; exit 1; fi
          echo "Uploading $IPA_PATH"

          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      # altool only uploads the binary. Without this step the build sits in
      # App Store Connect with no tester group and testers never see it
      # (happened with v0.14.0 = build 361, 2026-11-18). Waits for processing,
      # adds the build to the Internal group and, if the tag is annotated
      # with real text (`git tag -a v1.2.3 -m "…"`), uses that text as the
      # de-DE "What to Test" notes.
      - name: Distribute to Internal testers
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_APP_ID: "6807475637"
          TESTER_GROUP: Internal
        run: |
          set -euo pipefail
          brew install asc
          export ASC_CONFIG_PATH="$RUNNER_TEMP/asc-config.json"
          export ASC_BYPASS_KEYCHAIN=1
          printf '{"key_id":"%s","issuer_id":"%s","private_key_path":"%s"}' \
            "$APP_STORE_CONNECT_KEY_ID" "$APP_STORE_CONNECT_ISSUER_ID" "$ASC_KEY_PATH" > "$ASC_CONFIG_PATH"

          SEL=(--app "$ASC_APP_ID" --build-number "$BUILD_NUMBER" --platform IOS)
          asc builds wait "${SEL[@]}" --timeout 60m --fail-on-invalid --output table
          asc builds add-groups "${SEL[@]}" --group "$TESTER_GROUP" --output table

          TAG="${GITHUB_REF#refs/tags/}"
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          NOTES=$(git tag -l --format='%(contents)' "$TAG" | sed -e '/^-----BEGIN/,$d' | sed -e 's/[[:space:]]*$//')
          if [ -n "$NOTES" ] && [ "$NOTES" != "$TAG" ]; then
            BUILD_ID=$(asc builds info "${SEL[@]}" --output json | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])')
            asc builds test-notes update --build-id "$BUILD_ID" --locale de-DE --whats-new "$NOTES" --output table \
              || asc builds test-notes create "${SEL[@]}" --version "$MARKETING_VERSION" --locale de-DE --whats-new "$NOTES" --output table
          else
            echo "::notice::Tag $TAG has no release notes; add What to Test text in App Store Connect if wanted."
          fi
          rm -f "$ASC_CONFIG_PATH"

      # `uploadSymbols: true` in ExportOptions.plist only pushes dSYMs to
      # App Store Connect when `destination` is `upload` — with
      # `destination: export` (needed so we can find the .ipa to upload
      # ourselves above) it's a no-op; confirmed live 2026-09-07 (v0.1.6,
      # bug-371 investigation) that `$RUNNER_TEMP/export/dSYMs` doesn't
      # even get created in that mode ("No files were found"). The real
      # dSYM only exists inside the ARCHIVE, generated by the "Archive"
      # step above ("Generating BlindensportGraz.app.dSYM"), at
      # app.xcarchive/dSYMs/*.dSYM — that's what we upload here.
      # `altool --upload-app` never uploads symbols either way (binary
      # only), which is why `asc builds dsyms` stayed empty for every
      # build shipped through this workflow before this step existed.
      - name: Upload dSYMs artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dSYMs-${{ env.MARKETING_VERSION }}-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/app.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 90

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/private_keys"/*.p8 ~/.appstoreconnect/private_keys/*.p8 2>/dev/null || true
