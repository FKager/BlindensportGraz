# Tests of the bsg command line tool (cli/, Java 21). The web UI is mocked
# (WireMock); no secrets needed.
name: bsg Tests

on:
  push:
    branches: [main]
    paths: ["cli/**", ".github/workflows/bsg-test.yml"]
  pull_request:
    paths: ["cli/**", ".github/workflows/bsg-test.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: cli/pom.xml
      - name: mvn package (tests + jar)
        run: mvn -B package
