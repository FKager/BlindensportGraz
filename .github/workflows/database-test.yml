# Database tests (supabase/tests, pgTAP) against the migrations, on a fresh
# local Supabase stack. No project is contacted and no secrets are needed: the
# Apple secret only has to exist because config.toml references it.
name: Database Tests

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/database-test.yml"]
  pull_request:
    paths: ["supabase/**", ".github/workflows/database-test.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: unused
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 3.1.0
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,realtime,edge-runtime,postgres-meta,mailpit
      - name: Run database tests
        run: supabase test db
      # plpgsql lint of every function (unused/shadowed variables, …).
      - name: Lint database functions
        run: supabase db lint --level warning --fail-on warning
      # Supabase's Security and Performance Advisors (splinter, pinned);
      # fails on WARN/ERROR findings not accepted in supabase/advisors-accepted.txt.
      - name: Database advisors
        run: supabase/scripts/advisors.sh
