# Supabase project the web admin works on. Admins act with their OWN
# account (user JWT + anon key), so Supabase RLS and the RPCs decide what
# they may do, exactly like in the iOS app. The service key is used only for
# the calendar feed (/calendar/{token}), which has no signed-in user.
supabase.url=${SUPABASE_URL}
supabase.anon-key=${SUPABASE_ANON_KEY}
supabase.service-key=${SUPABASE_SERVICE_KEY:}

# The REST API's session cookie is Secure by default (Caddy terminates TLS in
# front of this server). Only for local testing over plain http://localhost:
# SESSION_COOKIE_SECURE=false.
webadmin.session-cookie-secure=${SESSION_COOKIE_SECURE:true}

quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0
quarkus.default-locale=de-AT
quarkus.log.category."it.a11y.blindensport".level=INFO

# Vaadin's own session cookie: Secure/HttpOnly/SameSite in SessionCookieSetup.java.

# Tests and dev mode: point at a local Supabase (`supabase start`) or WireMock.
%dev.supabase.url=${SUPABASE_URL:http://127.0.0.1:54321}
%dev.webadmin.session-cookie-secure=false
%test.supabase.url=http://localhost:0
%test.supabase.anon-key=test-anon-key
%test.supabase.service-key=test-service-key
%test.webadmin.session-cookie-secure=false
