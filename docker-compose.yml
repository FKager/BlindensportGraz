# Runs webadmin (Quarkus + Vaadin web admin, REST API, calendar feed) behind
# a bundled Caddy reverse proxy that terminates TLS — this is what makes it safe to
# expose to the internet (see webadmin/README.md "Deployment": the app
# itself speaks plain HTTP only, and must never be reachable directly).
# Works with both `docker compose up` and `podman-compose up`.
#
# Network layout:
#   internet --443/80--> caddy (published to 0.0.0.0) --8080--> webadmin
#                                                           (internal network
#                                                            only, no host
#                                                            port published)
#
# Usage:
#   1. cp .env.example .env   # fill in SUPABASE_URL, SUPABASE_ANON_KEY and
#      SUPABASE_SERVICE_KEY;
#      DOMAIN/ACME_EMAIL already default to a11y.it/dev@a11y.it
#   2. Point DOMAIN's DNS A/AAAA record at this host, and make sure ports
#      80+443 reach it (Caddy needs 80 for the ACME HTTP-01 challenge, not
#      just 443) — Let's Encrypt cannot issue a certificate otherwise.
#   3. docker compose up -d --build
#      podman-compose up -d --build

services:
  webadmin:
    build:
      context: webadmin
    image: webadmin:latest
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    networks:
      - internal
    # Deliberately NO `ports:` mapping — this service must only be reachable
    # from the `caddy` container over the internal compose network, never
    # directly from the host or the internet. If you need to hit it directly
    # for local debugging, use `docker compose exec` or temporarily add
    # `ports: ["127.0.0.1:8080:8080"]`, never a 0.0.0.0 binding.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Only what the Caddyfile needs — not env_file: .env, which would also
    # hand the proxy SUPABASE_SERVICE_KEY. Compose
    # reads these from .env for interpolation.
    #
    # `:-` (not `:?`): Compose interpolates this file for EVERY subcommand,
    # so a required-variable guard here would also break `down`/`ps`/`logs`
    # on an incomplete .env. The check runs when Caddy starts instead.
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    command:
      - sh
      - -c
      - |
        [ -n "$$DOMAIN" ] || { echo "caddy: set DOMAIN in .env" >&2; exit 1; }
        [ -n "$$ACME_EMAIL" ] || { echo "caddy: set ACME_EMAIL in .env" >&2; exit 1; }
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      # The only two ports this deployment exposes to the outside world.
      # 80 is required for Let's Encrypt's HTTP-01 challenge (Caddy also
      # uses it to redirect plain HTTP to HTTPS), not just for convenience.
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webadmin
    networks:
      - internal

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
